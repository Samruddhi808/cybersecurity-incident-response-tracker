<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIRT — Incident List</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark cirt-navbar">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="/"><i class="bi bi-shield-fill-exclamation me-2"></i>CIRT</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a></li>
                <li class="nav-item"><a class="nav-link active" href="/incidents"><i class="bi bi-list-ul me-1"></i>Incidents</a></li>
                <li class="nav-item"><a class="nav-link" href="/incidents/new"><i class="bi bi-plus-circle me-1"></i>New Incident</a></li>
                <li class="nav-item"><a class="nav-link" href="/alerts"><i class="bi bi-exclamation-triangle me-1"></i>Alerts</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container-fluid px-4 mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0 fw-bold">All Incidents</h1>
        <a href="/incidents/new" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i>Report Incident
        </a>
    </div>

    <!-- Search and Filter Bar -->
    <div class="card mb-4">
        <div class="card-body">
            <form method="get" action="/incidents" id="filter-form">
                <div class="row g-2 align-items-end">

                    <!-- Search -->
                    <div class="col-md-4">
                        <label for="search" class="form-label small fw-semibold">Search</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-search"></i></span>
                            <input type="text" id="search" name="search" class="form-control"
                                   placeholder="Search title or description..."
                                   th:value="${search}">
                        </div>
                    </div>

                    <!-- Severity Filter -->
                    <div class="col-md-2">
                        <label for="severity" class="form-label small fw-semibold">Severity</label>
                        <select id="severity" name="severity" class="form-select">
                            <option value="">All Severities</option>
                            <option th:each="sev : ${severities}"
                                    th:value="${sev}"
                                    th:text="${sev}"
                                    th:selected="${sev.name() == selectedSeverity}">
                            </option>
                        </select>
                    </div>

                    <!-- Status Filter -->
                    <div class="col-md-2">
                        <label for="status" class="form-label small fw-semibold">Status</label>
                        <select id="status" name="status" class="form-select">
                            <option value="">All Statuses</option>
                            <option th:each="sta : ${statuses}"
                                    th:value="${sta}"
                                    th:text="${sta}"
                                    th:selected="${sta.name() == selectedStatus}">
                            </option>
                        </select>
                    </div>

                    <!-- Category Filter -->
                    <div class="col-md-2">
                        <label for="category" class="form-label small fw-semibold">Category</label>
                        <select id="category" name="category" class="form-select">
                            <option value="">All Categories</option>
                            <option th:each="cat : ${categories}"
                                    th:value="${cat}"
                                    th:text="${cat}"
                                    th:selected="${cat.name() == selectedCategory}">
                            </option>
                        </select>
                    </div>

                    <!-- Buttons -->
                    <div class="col-md-2 d-flex gap-2">
                        <button type="submit" class="btn btn-primary flex-fill">
                            <i class="bi bi-funnel me-1"></i>Apply
                        </button>
                        <a href="/incidents" class="btn btn-outline-secondary" title="Clear filters">
                            <i class="bi bi-x-lg"></i>
                        </a>
                    </div>

                </div>
            </form>
        </div>
    </div>

    <!-- Results -->
    <div class="card">
        <div class="card-header">
            <span class="fw-semibold">
                <i class="bi bi-table me-2"></i>
                <span th:text="${#lists.size(incidents)}">0</span> incident(s) found
            </span>
        </div>
        <div class="card-body p-0">

            <div th:if="${#lists.isEmpty(incidents)}" class="text-center py-5 text-muted">
                <i class="bi bi-search fs-1 d-block mb-2"></i>
                No incidents match your search or filter criteria.
                <a href="/incidents">Clear and view all</a>.
            </div>

            <div th:if="${not #lists.isEmpty(incidents)}" class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>#ID</th>
                            <th>Title</th>
                            <th>Category</th>
                            <th>Severity</th>
                            <th>Status</th>
                            <th>Assigned To</th>
                            <th>Created</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="incident : ${incidents}">
                            <td class="text-muted small" th:text="${incident.id}"></td>
                            <td>
                                <a th:href="@{/incidents/{id}(id=${incident.id})}"
                                   th:text="${incident.title}"
                                   class="fw-semibold text-decoration-none"></a>
                            </td>
                            <td>
                                <span class="badge bg-secondary" th:text="${incident.category}"></span>
                            </td>
                            <td>
                                <span th:class="'badge severity-' + ${#strings.toLowerCase(incident.severity)}"
                                      th:text="${incident.severity}"></span>
                            </td>
                            <td>
                                <span th:class="'badge status-' + ${#strings.toLowerCase(incident.status)}"
                                      th:text="${incident.status}"></span>
                            </td>
                            <td th:text="${incident.assignedTo != null and !incident.assignedTo.isBlank()} ? ${incident.assignedTo} : '—'"></td>
                            <td class="text-muted small"
                                th:text="${#temporals.format(incident.createdAt, 'dd MMM yyyy HH:mm')}"></td>
                            <td>
                                <a th:href="@{/incidents/{id}(id=${incident.id})}"
                                   class="btn btn-sm btn-outline-primary">
                                    <i class="bi bi-eye"></i>
                                </a>
                                <a th:href="@{/incidents/{id}/edit(id=${incident.id})}"
                                   class="btn btn-sm btn-outline-secondary">
                                    <i class="bi bi-pencil"></i>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>

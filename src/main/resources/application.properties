# ============================================================
# CIRT Application — Main Configuration
# Uses environment variables so credentials are never in source code.
# Override any property by setting the corresponding env variable.
# ============================================================

spring.application.name=cirt-devops

# Server
server.port=9090

# ------ PostgreSQL (production/local) ------
# Set DB_URL, DB_USERNAME, DB_PASSWORD as environment variables.
# The defaults below are for a typical local PostgreSQL install.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cirt_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=Samu@1234!
spring.datasource.driver-class-name=org.postgresql.Driver

# ------ JPA / Hibernate ------
# 'update' auto-creates/updates tables on startup (OK for dev/student use).
# In production you would use a migration tool like Flyway instead.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ------ Thymeleaf ------
spring.thymeleaf.cache=false

# ------ Jackson (serialize LocalDateTime as ISO-8601 strings, not arrays) ------
spring.jackson.serialization.write-dates-as-timestamps=false

# ------ Logging ------
logging.level.com.cirt=INFO
logging.level.org.springframework.web=WARN

# ============================================================
# CIRT — CI Profile (spring.profiles.active=ci)
# Uses H2 in-memory database so the pipeline does not need PostgreSQL.
# Activated automatically by the Maven 'selenium' profile.
# ============================================================

spring.datasource.url=jdbc:h2:mem:cirt_ci;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Actuator health & Prometheus metrics endpoints
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

logging.level.org.springframework=WARN
logging.level.com.cirt=INFO

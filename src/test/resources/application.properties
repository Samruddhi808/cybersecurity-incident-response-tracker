# ============================================================
# CIRT Test Configuration
# Uses H2 in-memory database so tests run without PostgreSQL.
# This file is only active during 'mvn test' / 'mvn verify'.
# ============================================================

# H2 in-memory database (created fresh for each test run)
spring.datasource.url=jdbc:h2:mem:cirt_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 dialect
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Suppress noisy logs during tests
logging.level.org.springframework=WARN
logging.level.com.cirt=WARN
logging.level.org.hibernate=WARN
